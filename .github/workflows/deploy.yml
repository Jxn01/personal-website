name: deploy

# JXN-000 ships itself. Push to the default branch → a static build for
# https://jxn.hu (served from root); `publish` force-pushes its dist/ as a single
# commit to the `deploy` branch, which the self-hosted server pulls every
# 10 minutes and swaps in atomically. (GitHub Pages served a copy until jxn.hu
# went public on 2026-10-08.)

on:
  push:
    branches: [main]
  workflow_dispatch:

# one live deploy at a time; let an in-flight run finish
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Built with a READ-only token: install/build run third-party package code, which must never hold
  # the right to push. Only `publish` -- which runs none -- can write, and only the deploy branch.
  jxn-hu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history → real commit hash in the status readout
          persist-credentials: false # no token left in .git/config for build steps to find

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build
        env:
          SITE: https://jxn.hu # BASE_PATH unset → root "/"
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: jxn-hu-dist
          path: dist
          retention-days: 1

  publish:
    needs: jxn-hu
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the `deploy` branch
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jxn-hu-dist
          path: dist

      - name: publish dist/ to the deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
